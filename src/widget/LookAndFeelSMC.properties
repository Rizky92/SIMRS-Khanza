#
# SIMRS Khanza theme, loaded by FlatLaf for widget.LookAndFeelSMC.
# Arc values are corner diameters: an arc of 8 gives a 4px radius.
#

#---- variables ----

@accentColor = #16A05D
@foreground = #323232
@inputBorderColor = #646464

#---- font ----

defaultFont = 11 Tahoma

#---- component ----

Component.arc = 8
Component.borderWidth = 1
Component.focusWidth = 0
Component.innerFocusWidth = 0
Component.borderColor = @inputBorderColor
Component.disabledBorderColor = #CCCCCC
Component.minimumWidth = 0

TextComponent.arc = 8

#---- button ----

Button.arc = 8
Button.minimumWidth = 0
Button.innerFocusWidth = 0
Button.background = #FFFFFF00
Button.focusedBackground = #FFFFFF00
Button.disabledBackground = #FFFFFF00
Button.hoverBackground = #0000000F
Button.pressedBackground = #00000021
Button.selectedBackground = #00000033
Button.default.background = #FFFFFF00
Button.default.focusedBackground = #FFFFFF00
Button.default.hoverBackground = #0000000F
Button.default.pressedBackground = #00000021
Button.default.borderWidth = 1
Button.borderColor = #00000000
Button.disabledBorderColor = #00000000
Button.hoverBorderColor = @inputBorderColor
Button.pressedBorderColor = @inputBorderColor
Button.default.borderColor = #00000000
Button.default.hoverBorderColor = @inputBorderColor
Button.default.pressedBorderColor = @inputBorderColor

#---- combo box ----

ComboBox.padding = 2,4,2,4
ComboBox.minimumWidth = 0
ComboBox.popupItemInsets = 2,1,2,1

#---- tabbed pane ----

TabbedPane.selectedBackground = @accentColor
TabbedPane.selectedForeground = #FFFFFF
TabbedPane.focusColor = @accentColor
TabbedPane.focusForeground = #FFFFFF
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @accentColor
TabbedPane.unselectedBackground = #EFEFEF
TabbedPane.hoverColor = #E2E2E2
TabbedPane.hasFullBorder = false
TabbedPane.tabHeight = 24
TabbedPane.tabAreaAlignment = center
TabbedPane.contentAreaColor = $Table.gridColor

#---- option pane ----

OptionPane.messageFont = 14 Tahoma
OptionPane.buttonFont = 14 Tahoma bold
OptionPane.background = #FFFFFF

#---- date picker ----

DateTimePicker.sundayForeground = #C62828

#---- check box ----

CheckBox.arc = 7
CheckBox.icon.borderColor = @inputBorderColor

#---- text field ----

TextField.margin = 2,4,2,4
FormattedTextField.margin = 2,4,2,4
PasswordField.margin = 2,4,2,4

#---- text area ----

TextArea.margin = 4,4,4,4

#---- scroll pane ----

ScrollPane.TextComponent.arc = 8
ScrollPane.viewBorderColor = #D0D0D0

#---- table ----

Table.rowHeight = 24
Table.cellMargins = 2,2,2,2
Table.showHorizontalLines = true
Table.showVerticalLines = true
Table.intercellSpacing = 1,1
Table.gridColor = #EDEDED

TableHeader.height = 28
TableHeader.cellMargins = 6,2,6,2
