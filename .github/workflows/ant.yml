# Builds the application without compiling Jasper report designs.
# The resulting artifact contains no reports and will fail on any report action.

name: Java CI

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Subprojects to build alongside the main application.
        type: choice
        options:
          - important
          - all
          - none
          - KhanzaAntrianApotek
          - KhanzaAntrianLoket
          - KhanzaHMSServiceAplicare
          - KhanzaHMSServiceMobileJKNERM
          - KhanzaHMSServiceSatuSehat
          - KhanzaPengenkripsiTeks
          - anjunganpasienmandiri
        default: important
      subprojects:
        description: >-
          Space separated subproject directory names. Overrides the preset when
          filled in; leave empty to use the preset.
        type: string
        default: ''

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: jar
      artifact-name: Package
      subprojects: ${{ inputs.subprojects != '' && inputs.subprojects || inputs.preset }}
