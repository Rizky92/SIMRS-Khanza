# Builds the application and compiles the Jasper report designs, shipping the
# resulting .jasper files alongside it. Requires ecj-4.6.1.jar in the library
# bundle; build-ci.xml fails with an explanatory message if it is absent.

name: Java CI with Reports

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Subprojects to build alongside the main application.
        type: choice
        options:
          - important
          - all
          - none
          - KhanzaAntrianApotek
          - KhanzaAntrianLoket
          - KhanzaHMSServiceAplicare
          - KhanzaHMSServiceMobileJKNERM
          - KhanzaHMSServiceSatuSehat
          - KhanzaPengenkripsiTeks
          - anjunganpasienmandiri
        default: important
      subprojects:
        description: >-
          Space separated subproject directory names. Overrides the preset when
          filled in; leave empty to use the preset.
        type: string
        default: ''

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: jar compile-reports
      artifact-name: Package with Reports
      subprojects: ${{ inputs.subprojects != '' && inputs.subprojects || inputs.preset }}
